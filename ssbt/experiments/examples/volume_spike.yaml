version: 1
experiment:
  name: "volume_spike_study"
  type: event_study
  description: "Volume spike event study with forward return outcomes"

dataset:
  source: "synthetic_ohlcv.parquet"
  symbol: "SYNTH"
  timeframe: "1d"
  start: "2020-01-01"
  end: "2033-12-31"
  timezone: "UTC"
  adjustments:
    split_adjusted: true
    dividend_adjusted: true

features: []

events:
  - name: "volume_spike"
    params:
      window: 20
      multiplier: 2.5
      min_volume: 0
    cooldown_bars: 0
    min_separation_bars: 1

outcomes:
  - name: "forward_return"
    params:
      horizons: [1, 5, 10, 20]

filters:
  pre_event: []
  post_event: []

group_by: []

analysis:
  confidence:
    method: "bootstrap"
    iterations: 2000
    ci: 0.95
  statistics:
    include: ["mean", "median", "std", "hit_rate", "quantiles"]
    quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]

reporting:
  output_dir: "artifacts"
  formats: ["csv", "json", "parquet"]
  charts: ["distribution", "grouped_bar", "event_timeline"]

execution:
  seed: 42
  max_workers: 1
  cache_features: true
  fail_on_warnings: false