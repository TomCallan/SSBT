[project]
name = "ssbt"
version = "0.3.0"
description = "Super Simple Backtesting Tool — minimal, performant, event-driven"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "numba>=0.66.0",
    "pyyaml>=6.0",
    "yfinance>=1.5.2",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pyyaml>=6.0"]
fast = ["numba>=0.58"]

[project.scripts]
ssbt = "ssbt.cli:main"
ssbt-run = "ssbt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "docs*", "examples*", "artifacts*"]
